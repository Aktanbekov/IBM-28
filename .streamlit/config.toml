# CaseBridge theme: white paper, graphite ink, ballpoint-blue rail, highlighter colours for evidence.
# Fonts are served from static/ so the offline demo never needs the network.

[server]
enableStaticServing = true

[client]
# Hide the Deploy button and developer menu so the demo shows only the product.
toolbarMode = "minimal"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible"
url = "app/static/fonts/AtkinsonHyperlegible-Regular.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible"
url = "app/static/fonts/AtkinsonHyperlegible-Bold.woff2"
weight = 700
style = "normal"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible"
url = "app/static/fonts/AtkinsonHyperlegible-Italic.woff2"
weight = 400
style = "italic"

[theme]
base = "light"
font = "Atkinson Hyperlegible, system-ui, sans-serif"
headingFont = "Atkinson Hyperlegible, system-ui, sans-serif"
headingFontSizes = ["2.125rem", "1.5rem", "1.3rem", "1rem", "0.9375rem", "0.875rem"]
headingFontWeights = [700, 700, 700, 700, 700, 700]
primaryColor = "#2A4BB8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F8"
textColor = "#1E2230"
linkColor = "#2A4BB8"
borderColor = "#DADDE6"
redColor = "#B42318"
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false
paddingTop = "2.5rem"

[theme.sidebar]
backgroundColor = "#2A4BB8"
secondaryBackgroundColor = "#2341A3"
codeBackgroundColor = "#2341A3"
textColor = "#FFFFFF"
borderColor = "#4D68C6"
primaryColor = "#FFE45C"
linkColor = "#FFE45C"
