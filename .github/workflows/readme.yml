name: Tests and README

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test-and-update-readme:
    runs-on: ubuntu-latest
    # Skip the commit this workflow pushes itself, so it never loops.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
        env:
          LLM_BACKEND: rules

      - name: Refresh README auto sections
        if: github.event_name == 'push'
        env:
          LLM_BACKEND: rules
        run: python scripts/update_readme.py

      - name: Commit README if it changed
        if: github.event_name == 'push'
        run: |
          if git diff --quiet README.md; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: auto-update README [skip ci]"
          git push
